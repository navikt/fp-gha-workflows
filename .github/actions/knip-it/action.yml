name: Kjør Knip
description: |-
  Kjører Knip for å finne ubrukt kode og eksporter. Actionen autentiserer med den
  innebygde `github.token`, så den kallende jobben MÅ sette
  ```
  permissions: 
    packages: read # for å hente `@navikt`/`@nais`-pakker
    pull-requests: write # for å poste Knip-rapporten som PR-kommentar
  ```
inputs:
  package-manager:
    description: Package manager som skal brukes (pnpm|yarn).
    required: true
  node-version:
    description: Node version som brukes.
    default: "26"
    required: false

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

    - uses: navikt/fp-gha-workflows/.github/actions/setup-yarnrc@main # ratchet:exclude
      if: inputs.package-manager == 'yarn'

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # ratchet:pnpm/action-setup@v6.0.10
      if: inputs.package-manager == 'pnpm'

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager }}
        registry-url: 'https://npm.pkg.github.com'
        scope: '@navikt'

    - name: Yarn install
      if: inputs.package-manager == 'yarn'
      shell: bash
      run: |
        yarn install --immutable

    - name: Pnpm install
      if: inputs.package-manager == 'pnpm'
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}

    - name: Run Knip
      id: knip
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        set +e
        if [ "$PACKAGE_MANAGER" = "yarn" ]; then
          yarn knip --reporter=markdown > knip-report.md
        elif [ "$PACKAGE_MANAGER" = "pnpm" ]; then
          pnpm exec knip --reporter=markdown > knip-report.md
        else
          echo "Unsupported package manager: $PACKAGE_MANAGER"
          exit 1
        fi
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Slett forrige kommentar fra Knip
      if: github.event.pull_request.number
      shell: bash
      continue-on-error: true
      run: gh pr comment ${{ github.event.pull_request.number }} --delete-last --yes
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Post Knip rapport
      if: github.event.pull_request.number
      shell: bash
      run: |
        number_of_words=$(wc -w < knip-report.md)
        if [ $number_of_words -gt 3 ]; then
          gh pr comment ${{ github.event.pull_request.number }} --body-file knip-report.md
        fi
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Oppsummer Knip rapport
      shell: bash
      run: cat knip-report.md >> $GITHUB_STEP_SUMMARY

    - name: Feil bygg dersom Knip fant problemer
      if: steps.knip.outputs.exit_code != '0'
      shell: bash
      run: |
        echo "::error::Knip fant ubrukt kode/eksporter/avhengigheter. Se rapporten over (steg 'Oppsummer Knip rapport') eller PR-kommentaren for detaljer."
        exit 1
