name: Kjør Knip
description: Kjører Knip for å finne ubrukt kode og eksporter
inputs:
  npm-auth-token:
    description: Token med `packages:read` for navikt organisasjonen.
    required: true
  package-manager:
    description: Package manager som skal brukes (pnpm|yarn).
    required: true
  node-version:
    description: Node version som brukes.
    default: "26"
    required: false
  github-token:
    description: Token som skal brukes for å publisere en PR kommentar.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

    - uses: navikt/fp-gha-workflows/.github/actions/setup-yarnrc@main # ratchet:exclude
      if: inputs.package-manager == 'yarn'
      with:
        npmAuthToken: ${{ inputs.npm-auth-token }}

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # ratchet:pnpm/action-setup@v6.0.9
      if: inputs.package-manager == 'pnpm'

    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager }}
        registry-url: "https://npm.pkg.github.com"

    - name: Yarn install
      if: inputs.package-manager == 'yarn'
      shell: bash
      run: yarn install --immutable

    - name: Pnpm install
      if: inputs.package-manager == 'pnpm'
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-auth-token }}

    - name: Run Knip
      id: knip
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager == 'yarn' && 'yarn' || 'pnpm' }}
      run: |
        set +e
        $PACKAGE_MANAGER exec knip --reporter markdown > knip-report.md
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Slett forrige kommentar fra Knip
      if: github.event.pull_request.number
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        comment_count=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments | map(select(.author.login == "github-actions")) | length')
        if [ "$comment_count" -gt 0 ]; then
          gh pr comment "$PR_NUMBER" --delete-last --yes
        fi

    - name: Post Knip rapport
      if: github.event.pull_request.number
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        number_of_words=$(wc -w < knip-report.md)
        if [ "$number_of_words" -gt 3 ]; then
          gh pr comment "$PR_NUMBER" --body-file knip-report.md
        fi

    - name: Oppsummer Knip rapport
      shell: bash
      run: cat knip-report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Feil bygg dersom Knip fant problemer
      if: steps.knip.outputs.exit_code != '0'
      shell: bash
      run: |
        echo "::error::Knip fant ubrukt kode/eksporter/avhengigheter. Se rapporten over (steg 'Oppsummer Knip rapport') eller PR-kommentaren for detaljer."
        exit 1
