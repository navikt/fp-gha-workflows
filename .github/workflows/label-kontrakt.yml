name: "Label kontrakt-PRer"
# Gjenbrukbar workflow for kontraktmerking. Kalleren bestemmer paths-filteret.
# Eksempel:
# ```yaml
# on:
#   pull_request:
#     types: [opened, synchronize, reopened]
#     paths: ['kontrakter/**']
# jobs:
#   label:
#     permissions:
#       pull-requests: write
#     uses: navikt/fp-gha-workflows/.github/workflows/label-kontrakt.yml@main # ratchet:exclude
# ```
# Valgfri input: label-description (standard: "Endrer kontrakter/").
# Bruker innebygd GITHUB_TOKEN; ikke send secrets.

on:
  workflow_call:
    inputs:
      label-description:
        description: Beskrivelse ved opprettelse av kontrakt-labelen.
        required: false
        type: string
        default: "Endrer kontrakter/"

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label kontrakt-PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL_DESCRIPTION: ${{ inputs.label-description }}
        run: |
          : "${PR_NUMBER:?Workflowen krever en pull request-kontekst.}"

          existing_label=$(gh api --paginate "repos/$GITHUB_REPOSITORY/labels" \
            --jq '.[] | select(.name == "kontrakt") | .name')
          if [[ -z "$existing_label" ]]; then
            gh label create kontrakt --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
              --description "$LABEL_DESCRIPTION"
          fi

          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label kontrakt
