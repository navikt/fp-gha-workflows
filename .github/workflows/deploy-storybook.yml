name: Deploy storybook
on:
  workflow_call:
    secrets:
      READER_TOKEN:
        description: "Utdatert: la stå tom så brukes GITHUB_TOKEN. Kallende jobb må da ha `permissions: { packages: read }`."
        required: false
    inputs:
      package-manager:
        required: true
        type: string
        description: Package manager som skal brukes (pnpm|yarn)
      cache:
        required: true
        type: string
        description: Cache som skal brukes (turbo/lerna). Lerna er ikke implementert
      node-version:
        type: string
        description: Node version som brukes.
        default: "26"
        required: false

jobs:
  deploy-storybook:
    name: Deploy storybook ${{ inputs.package-manager }}
    permissions:
      contents: write
      pages: write
      id-token: write
      packages: read
    runs-on: "ubuntu-latest"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Trinn 1: Sjekk ut repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      # Trinn 2 Sett opp yarn/pnpm + node
      - uses: navikt/fp-gha-workflows/.github/actions/setup-yarnrc@main # ratchet:exclude
        if: inputs.package-manager == 'yarn'
        with:
          npmAuthToken: ${{ secrets.READER_TOKEN || github.token }}

      - uses: navikt/fp-gha-workflows/.github/actions/setup-npmrc@main # ratchet:exclude
        if: inputs.package-manager == 'pnpm'
        with:
          npmAuthToken: ${{ secrets.READER_TOKEN || github.token }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # ratchet:pnpm/action-setup@v6.0.10
        if: inputs.package-manager == 'pnpm'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      # Trinn 3: Håndter caching for turbo builds
      - name: Cache turbo build setup
        if: inputs.cache == 'turbo'
        id: hent-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/restore@v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Trinn 4: yarn install+build
      - name: Installer avhengigheter med Yarn
        if: inputs.package-manager == 'yarn'
        run: |
          yarn install --immutable
      - name: Bygg Storybook med Yarn
        if: inputs.package-manager == 'yarn'
        run: yarn build:storybook

      # Trinn 4: pnpm install+build
      - name: Installer avhengigheter med Pnpm
        if: inputs.package-manager == 'pnpm'
        run: |
          pnpm install --frozen-lockfile
      - name: Bygg Storybook med Pnpm
        if: inputs.package-manager == 'pnpm'
        run: pnpm build:storybook

      # Trinn 5: Konfigurer og deploy til GitHub Pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # ratchet:actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # ratchet:actions/upload-pages-artifact@v5.0.0
        with:
          path: ./.storybook-static-build

      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # ratchet:actions/deploy-pages@v5.0.0
        id: deployment

      # Trinn 6: Lagre turbo cache
      - name: Lagre turbo cache
        if: always() && inputs.cache == 'turbo' && steps.hent-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache/save@v6.1.0
        with:
          key: ${{ steps.hent-cache.outputs.cache-primary-key }}
          path: .turbo
